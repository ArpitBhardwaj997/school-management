<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="login">
    <div class="hero">
      <div class="logo">🎓</div>
      <h2>School Admin</h2>
      <p>Classes, students, fees and payments in one secure place.</p>
    </div>
    <form id="login-form">
      <h1>Welcome back</h1>
      <p class="sub">Log in to continue</p>
      <label>Username <input id="u" required autocomplete="username" placeholder="Admin username"></label>
      <label>Password <input id="p" type="password" required autocomplete="current-password" placeholder="••••••••"></label>
      <p id="login-err" class="err"></p>
      <button class="wide">Log in</button>
    </form>
  </main>

  <div id="app" hidden>
    <aside>
      <div class="brand"><span class="logo sm">🎓</span> School Admin</div>
      <nav id="nav"></nav>
      <div class="foot">
        <small id="timer"></small>
        <button id="logout" class="ghost">Log out</button>
      </div>
    </aside>
    <section>
      <header><h1 id="title"></h1></header>
      <div id="content"></div>
    </section>
  </div>

  <dialog id="dlg"><form id="dlg-body"></form></dialog>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
