<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | School Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside>
      <div class="brand"><span class="logo sm">🎓</span> School Admin</div>
      <nav id="nav"></nav>
      <div class="foot">
        <small id="timer"></small>
        <button id="logout" class="ghost">Log out</button>
      </div>
    </aside>
    <section>
      <header><h1 id="title"></h1></header>
      <div id="content"></div>
    </section>
  </div>

  <dialog id="dlg"><form id="dlg-body"></form></dialog>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
